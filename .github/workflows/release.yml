name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión sin prefijo v (ej. 1.1.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.38.10'

jobs:
  version:
    name: Resolver versión
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      build: ${{ steps.resolve.outputs.build }}
    steps:
      - id: resolve
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$VERSION" ]; then
            echo "No se pudo determinar la versión" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Versión: $VERSION (build ${{ github.run_number }})"

  windows:
    name: Windows (setup + portable)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Compilar release
        run: >
          flutter build windows --release
          --build-name ${{ needs.version.outputs.version }}
          --build-number ${{ needs.version.outputs.build }}

      - name: Compilar actualizador
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:winexe /optimize+ `
            /out:"build\windows\x64\runner\Release\maple_updater.exe" `
            /r:System.Windows.Forms.dll /r:System.Drawing.dll `
            "updater\MapleUpdater.cs"
          if ($LASTEXITCODE -ne 0) { throw "csc fallo con codigo $LASTEXITCODE" }
          Get-Item "build\windows\x64\runner\Release\maple_updater.exe" | Select-Object Name, Length

      - name: Empaquetar yt-dlp y ffmpeg
        shell: pwsh
        run: |
          $rel = "build/windows/x64/runner/Release"
          New-Item -ItemType Directory -Force -Path "$rel/bin" | Out-Null
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "$rel/bin/yt-dlp.exe"
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg-tmp" -Force
          $ffmpeg = Get-ChildItem -Path "ffmpeg-tmp" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobe = Get-ChildItem -Path "ffmpeg-tmp" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          Copy-Item $ffmpeg.FullName "$rel/bin/ffmpeg.exe"
          Copy-Item $ffprobe.FullName "$rel/bin/ffprobe.exe"
          Get-ChildItem "$rel/bin" | Select-Object Name, Length

      - name: ZIP portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          $name = "maple-video-downloader-${{ needs.version.outputs.version }}-windows-x64.zip"
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "dist/$name" -CompressionLevel Optimal
          Get-Item "dist/$name" | Select-Object Name, Length

      - name: Instalar NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Compilar instalador
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          $build = Join-Path $root "build\windows\x64\runner\Release"
          $dist = Join-Path $root "dist"
          & "C:\Program Files (x86)\NSIS\makensis.exe" `
            "/DVERSION=${{ needs.version.outputs.version }}" `
            "/DBUILD_DIR=$build" `
            "/DINSTALLER_DIR=$dist" `
            "/DPROJECT_DIR=$root" `
            "installer\windows\maple-video-downloader.nsi"
          if ($LASTEXITCODE -ne 0) { throw "makensis fallo con codigo $LASTEXITCODE" }
          Get-ChildItem "dist" | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux (tar.gz)
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev libwebkit2gtk-4.1-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Compilar release
        run: >
          flutter build linux --release
          --build-name ${{ needs.version.outputs.version }}
          --build-number ${{ needs.version.outputs.build }}

      - name: Empaquetar tar.gz
        run: |
          mkdir -p dist
          tar czf "dist/maple-video-downloader-${{ needs.version.outputs.version }}-linux-x64.tar.gz" \
            -C build/linux/x64/release/bundle .
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publicar release
    needs: [version, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generar SHA256SUMS.txt
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Extraer notas del CHANGELOG
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib

          version = os.environ["VERSION"]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          marker = f"## v{version}"
          if marker not in text:
              raise SystemExit(f"Falta la seccion {marker} en CHANGELOG.md")
          section = text.split(marker, 1)[1].split("\n## ", 1)[0].strip()
          pathlib.Path("dist/RELEASE_NOTES.md").write_text(section, encoding="utf-8")
          print(section)
          PY

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Maple Video Downloader v${{ needs.version.outputs.version }}
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
